spring.application.name=booking-service
server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
customer.service.base-url=${CUSTOMER_SERVICE_BASE_URL:http://localhost:8081}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:8080}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
spring.boot.admin.client.url=${SPRING_BOOT_ADMIN_CLIENT_URL:http://localhost:8081}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s